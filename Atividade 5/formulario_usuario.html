<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro: Usuário</title>
</head>

<body style="
      background-color: pink;
      border: 2px solid black;
      border-radius: 10px;
      padding: 3px;
    ">
  <header>
    <h1>CriArte</h1>
    <nav>
      <a href="pagina_inicial.html">Início</a> |
      <a href="formulario_receita.html">Cadastro de receita</a> |
      <a href="formulario_loja.html">Cadastro de loja</a> |
      <a href="formulario_galeria.html">Cadastro de galeria</a> |
      <a href="contato.html">Contato</a>
    </nav>
  </header>
  <form action="placeholderTratemento" method="post" enctype="multipart/form-data">
    <fieldset>
      <legend>Cadastro de Usuário</legend>
      <label for="user">Nome: </label>
      <br />
      <input type="text" name="nome" placeholder="Inserir nome identificador" id="nome" required />
      <br />
      <label for="usuario">Usuário </label>
      <br />
      <input type="text" name="username" placeholder="Inserir usuário" id="username" required />
      <br />
      <p>Gênero:</p>
      <input type="radio" name="sexo" id="masculino" value="masculino" required />
      <label for="masculino">Masculino</label>
      <input type="radio" name="sexo" id="feminino" value="feminino" required />
      <label for="feminino">Feminino</label>
      <input type="radio" name="sexo" id="outro" value="outro" required />
      <label for="outro">Outro</label>
      <input type="radio" name="sexo" id="prefiroNaoInformar" value="prefiroNaoInformar" required />
      <label for="prefiroNaoInformar">Prefiro não informar</label>
      <br />
      <label for="email">Email: </label>
      <br />
      <input type="email" name="email" placeholder="exemplo@exemplo.com" id="email" required />
      <br />
      <label for="senha">Senha: </label>
      <br />
      <input type="password" name="senha" placeholder="Inserir senha" id="senha" required />
      <br />
      <label for="telefone">Contato: </label>
      <br />
      <input type="tel" name="contato" placeholder="Inserir número de telefone" id="contato" maxlength="50" />
      <br />
      <label for="perfil">Imagem de Perfil</label>
      <br />
      <input type="file" name="foto_perfil" id="foto_perfil" accept="image/png, image/jpeg" />
      <br />
      Habilidades:
      <select name="type" id="type" required>
        <option value="" selected disabled>Selecione a habilidade</option>
        <option value="tailoring">Costura</option>
        <option value="crochet">Crochê</option>
        <option value="knitting">Tricô</option>
        <option value="painting">Pintura</option>
        <option value="ceramics">Cerâmica</option>
        <option value="other">Outro</option>
      </select>
      <br />
      <label for="termos">Aceito os termos de uso da Empresa</label>
      <input type="checkbox" name="aceita_termos" id="aceita_termos" required />
      <br />
      <button type="submit">Enviar</button>
      <br />
      <button type="reset">Resetar</button>
    </fieldset>
  </form>

  <form id="formUsuarioConsulta">
    <fieldset>
      <legend>Consulta de Usuário</legend>

      <label for="usuario_id_consulta">ID do Usuário:</label>
      <br />
      <input type="number" id="usuario_id_consulta" name="usuario_id" placeholder="Digite o ID para consultar"
        required />
      <br /><br />
      <button type="button">Consultar</button>
    </fieldset>
  </form>

  <form id="formUsuarioAlteracao" enctype="multipart/form-data">
    <fieldset>
      <legend>Alteração de Usuário</legend>

      <label for="usuario_id_alteracao">ID do Usuário:</label>
      <br />
      <input type="number" id="usuario_id_alteracao" name="usuario_id" placeholder="Digite o ID a ser alterado"
        required />
      <br /><br />

      <label for="nome_alteracao">Nome: </label>
      <br />
      <input type="text" name="nome" placeholder="Inserir novo nome" id="nome_alteracao" />
      <br />

      <label for="username_alteracao">Usuário: </label>
      <br />
      <input type="text" name="username" placeholder="Inserir novo usuário" id="username_alteracao" />
      <br />

      <p>Gênero:</p>
      <input type="radio" name="sexo_alteracao" id="masculino_alteracao" value="masculino" />
      <label for="masculino_alteracao">Masculino</label>
      <input type="radio" name="sexo_alteracao" id="feminino_alteracao" value="feminino" />
      <label for="feminino_alteracao">Feminino</label>
      <input type="radio" name="sexo_alteracao" id="outro_alteracao" value="outro" />
      <label for="outro_alteracao">Outro</label>
      <input type="radio" name="sexo_alteracao" id="prefiroNaoInformar_alteracao" value="prefiroNaoInformar" />
      <label for="prefiroNaoInformar_alteracao">Prefiro não informar</label>
      <br />

      <label for="email_alteracao">Email: </label>
      <br />
      <input type="email" name="email" placeholder="novoexemplo@exemplo.com" id="email_alteracao" />
      <br />

      <label for="senha_alteracao">Senha: </label>
      <br />
      <input type="password" name="senha" placeholder="Inserir nova senha" id="senha_alteracao" />
      <br />

      <label for="contato_alteracao">Contato: </label>
      <br />
      <input type="tel" name="contato" placeholder="Inserir novo número de telefone" id="contato_alteracao"
        maxlength="50" />
      <br />

      <label for="foto_perfil_alteracao">Nova Imagem de Perfil</label>
      <br />
      <input type="file" name="foto_perfil" id="foto_perfil_alteracao" accept="image/png, image/jpeg" />
      <br />

      Habilidades:
      <select name="type" id="type_alteracao">
        <option value="" selected disabled>Selecione a habilidade</option>
        <option value="tailoring">Costura</option>
        <option value="crochet">Crochê</option>
        <option value="knitting">Tricô</option>
        <option value="painting">Pintura</option>
        <option value="ceramics">Cerâmica</option>
        <option value="other">Outro</option>
      </select>
      <br />

      <label for="aceita_termos_alteracao">Aceito os termos de uso da Empresa</label>
      <input type="checkbox" name="aceita_termos" id="aceita_termos_alteracao" />
      <br /><br />

      <button type="button">Alterar</button>
    </fieldset>
  </form>

  <form id="formUsuarioRemocao">
    <fieldset>
      <legend>Remoção de Usuário</legend>

      <label for="usuario_id_remocao">ID do Usuário:</label>
      <br />
      <input type="number" id="usuario_id_remocao" name="usuario_id" placeholder="Digite o ID para remover" required />
      <br /><br />
      <button type="button">Remover</button>
    </fieldset>
  </form>

  <hr>

  <section>
    <h3>Verifica a matrícula</h3>
    <label for="matricula">Inserir Matrícula: </label>
    <input type="text" name="Matricula" id="matricula" placeholder="Inserir matrícula" required />
    <button type="button" onclick="verificarMatricula()">Verificar</button>
    <img src="" alt="" id="idIMG" style="display: none; width: 250px; height: 250px; cursor: pointer" />
    <p id="mensagemErro" style="display: none"></p>

    <script>
      let matriculas = [
        "12321BCC043",
        "12321BCC038",
        "12311BCC069",
        "12321BCC024",
        "12221BCC037",
        "12111BSI285",
      ];

      var indiceAtual = -1;

      function verificarMatricula() {
        var matricula = document
          .getElementById("matricula")
          .value.trim()
          .toUpperCase();

        indiceAtual = matriculas.indexOf(matricula);

        exibirAlunos(matricula);
      }

      function exibirAlunos(matricula) {
        var imagem = document.getElementById("idIMG");
        var mensagemErro = document.getElementById("mensagemErro");

        imagem.style.display = "block";
        mensagemErro.style.display = "none";

        switch (matricula) {
          case "12321BCC043":
            imagem.src = "assets/time/Ayato.jpg";
            imagem.alt = "Imagem de 12321BCC043";
            break;

          case "12321BCC038":
            imagem.src = "assets/time/Erick.jpeg";
            imagem.alt = "Imagem de 12321BCC038";
            break;

          case "12321BCC024":
            imagem.src = "assets/time/Maria_Rita.jpeg";
            imagem.alt = "Imagem de 12321BCC024";
            break;

          case "12221BCC037":
            imagem.src = "assets/time/Murilo.jpg";
            imagem.alt = "Imagem de 12221BCC037";
            break;

          case "12311BCC069":
            imagem.src = "assets/time/Luis_Felipe.jpg";
            imagem.alt = "Imagem de 12311BCC069";
            break;

          case "12111BSI285":
            imagem.src = "assets/time/Vinicius.jpeg";
            imagem.alt = "Imagem de 12111BSI285";
            break;

          default:
            imagem.style.display = "none";
            imagem.src = "";
            imagem.alt = "";

            mensagemErro.innerHTML =
              "Matrícula não existe, inserir uma matrícula válida";
            mensagemErro.style.color = "red";
            mensagemErro.style.fontWeight = "bold";
            mensagemErro.style.display = "block";
            break;
        }
      }

      document.getElementById("idIMG").addEventListener("click", function () {
        if (indiceAtual !== -1) {
          indiceAtual = (indiceAtual + 1) % matriculas.length;
          let proximaMatricula = matriculas[indiceAtual];

          document.getElementById("matricula").value = proximaMatricula;

          exibirAlunos(proximaMatricula);
        }
      });
    </script>
  </section>
</body>

</html>
